<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 176" width="1000" height="176" role="img" aria-labelledby="t d">
<title id="t">Protocol: question, prototype, break, understand, ship</title><desc id="d">An animated loop: question, prototype, break, understand, ship, then back to question.</desc>
<defs><pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#fff" fill-opacity=".05"/></pattern><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#25E8FF" stroke-opacity=".07"/></pattern><radialGradient id="vig" cx="50%" cy="50%" r="75%"><stop offset="55%" stop-color="#000" stop-opacity="0"/><stop offset="100%" stop-color="#000" stop-opacity=".6"/></radialGradient><filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><linearGradient id="sweep" x1="0" x2="1"><stop offset="0" stop-color="#B6FF3B" stop-opacity="0"/><stop offset=".5" stop-color="#B6FF3B"/><stop offset="1" stop-color="#B6FF3B" stop-opacity="0"/></linearGradient></defs>
<rect width="1000" height="176" fill="#07060E"/><rect width="1000" height="176" fill="url(#grid)"/>
<rect x="10" y="10" width="980" height="156" fill="none" stroke="#25E8FF" stroke-opacity=".4" stroke-width="1"/><path d="M10 32V10H32M968 10H990V32M10 144V166H32M968 166H990V144" fill="none" stroke="#FF3DA5" stroke-width="2.2"/>
<text x="40" y="40" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#F4F1FF" text-anchor="start" font-weight="normal" letter-spacing="3" >PROTOCOL</text>
<text x="960" y="40" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#8A86A6" text-anchor="end" font-weight="normal" letter-spacing="2" >RUNS UNTIL IT STOPS BEING WRONG</text>
<g><rect x="34" y="58" width="152" height="48" rx="24" fill="#07060E" stroke="#25E8FF" stroke-width="1.8"/><text x="110" y="88" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="15" fill="#F4F1FF" text-anchor="middle" font-weight="bold" letter-spacing="0" >question</text></g>
