<path d="M890 110V136H110V114" fill="none" stroke="#FF3DA5" stroke-width="1.6" stroke-dasharray="6 6"><animate attributeName="stroke-dashoffset" from="24" to="0" dur="1.2s" repeatCount="indefinite"/></path>
