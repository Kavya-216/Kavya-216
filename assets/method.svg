<rect x="229" y="58" width="152" height="48" rx="24" fill="#B6FF3B" opacity="0"><animate attributeName="opacity" values="0;0;0.5;0;0" keyTimes="0;0.0875;0.1175;0.1775;1" dur="8s" repeatCount="indefinite"/></rect>
