<g fill="#a78bfa" filter="url(#glow)">
 <circle cx="180" cy="235" r="8"/><circle cx="455" cy="215" r="7"/><circle cx="590" cy="235" r="10"/><circle cx="725" cy="215" r="7"/><circle cx="930" cy="235" r="8"/>
</g>
