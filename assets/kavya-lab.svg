<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-label="Kavya's idea to project signal map">
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#08060d"/><stop offset=".55" stop-color="#11091d"/><stop offset="1" stop-color="#07050b"/></linearGradient>
 <linearGradient id="violet" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#6d28d9"/><stop offset=".5" stop-color="#c084fc"/><stop offset="1" stop-color="#7c3aed"/></linearGradient>
 <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <filter id="blur"><feGaussianBlur stdDeviation="35"/></filter>
 <style>
 .m{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;fill:#ddd6fe}.d{fill:#81758f}.s{font-size:13px}.b{font-size:16px}.h{font-size:25px;font-weight:700;letter-spacing:1px}.box{fill:#090711;stroke:#4c1d95}.edge{stroke:#6d28d9;stroke-opacity:.45}.node{fill:#a78bfa}
 </style>
</defs>
<rect width="1200" height="430" rx="22" fill="url(#bg)"/>
<circle cx="590" cy="215" r="175" fill="#7c3aed" opacity=".08" filter="url(#blur)"/>

<text x="36" y="40" class="m s d">LAB / 216</text>
