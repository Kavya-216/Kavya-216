<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Kavya's field notebook</title>
  <desc id="desc">A hand-drawn research diagram connecting a question, a prototype, and a useful system.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#11151d"/>
      <stop offset="1" stop-color="#080a0f"/>
    </linearGradient>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="420" rx="18" fill="url(#paper)" stroke="#303846" stroke-width="2"/>
  <path d="M52 76H1148M52 346H1148" stroke="#1e2631" stroke-width="1"/>
  <path d="M74 44V376M1126 44V376" stroke="#1e2631" stroke-width="1"/>
  <g fill="#72f1d1" opacity=".7">
    <circle cx="90" cy="110" r="2"/><circle cx="90" cy="126" r="2"/><circle cx="90" cy="142" r="2"/>
    <circle cx="1110" cy="276" r="2"/><circle cx="1110" cy="292" r="2"/><circle cx="1110" cy="308" r="2"/>
  </g>
  <g fill="#f5f2ea" font-family="monospace">
    <text x="106" y="109" font-size="13" letter-spacing="3" fill="#72f1d1">FIELD NOTE / 01</text>
    <text x="106" y="173" font-size="54" font-weight="700" letter-spacing="2">KAVYA</text>
    <text x="109" y="202" font-size="14" fill="#a9b2bf">CSE · AI/ML · BACKEND SYSTEMS</text>
    <text x="106" y="300" font-size="14" fill="#a9b2bf">working theory:</text>
    <text x="106" y="326" font-size="21">interesting software starts with a better question.</text>
  </g>
  <g fill="none" stroke="#72f1d1" stroke-width="2">
    <path d="M566 182C632 116 682 116 728 182C774 248 824 248 884 182" stroke-dasharray="7 9"/>
    <path d="M566 182C632 248 682 248 728 182C774 116 824 116 884 182" stroke="#4f6371" stroke-dasharray="3 10"/>
    <circle cx="566" cy="182" r="33" fill="#11151d"/>
    <circle cx="728" cy="182" r="33" fill="#11151d"/>
    <circle cx="884" cy="182" r="33" fill="#11151d"/>
  </g>
  <g fill="#f5f2ea" font-family="monospace" text-anchor="middle">
    <text x="566" y="178" font-size="13">ASK</text><text x="566" y="196" font-size="11" fill="#a9b2bf">why?</text>
    <text x="728" y="178" font-size="13">MAKE</text><text x="728" y="196" font-size="11" fill="#a9b2bf">test it</text>
    <text x="884" y="178" font-size="13">USE</text><text x="884" y="196" font-size="11" fill="#a9b2bf">ship it</text>
  </g>
  <g font-family="monospace" font-size="12" fill="#a9b2bf">
    <text x="530" y="280">hypothesis → prototype → evidence</text>
    <text x="940" y="105" fill="#72f1d1">STATUS: CURIOUS</text>
    <text x="940" y="126">sleep: optional</text>
    <text x="940" y="147">assumptions: under review</text>
  </g>
  <path d="M104 365H318" stroke="#72f1d1" stroke-width="3" filter="url(#softGlow)"/>
</svg>
