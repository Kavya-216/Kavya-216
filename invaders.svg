<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-labelledby="title desc">
  <title id="title">Kavya Space Invaders</title>
  <desc id="desc">An animated arcade-style Space Invaders scene representing GitHub contributions.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070A16"/>
      <stop offset="0.55" stop-color="#10152A"/>
      <stop offset="1" stop-color="#090C19"/>
    </linearGradient>

    <linearGradient id="screenGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#17213D" stop-opacity=".72"/>
      <stop offset="1" stop-color="#0A0E1D" stop-opacity=".9"/>
    </linearGradient>

    <filter id="glowCyan" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <filter id="glowWarm" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#B9C4E4" stroke-opacity=".045"/>
    </pattern>

    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      .label { letter-spacing: 3px; }
      .tiny { font-size: 11px; }
    </style>
  </defs>

  <!-- BACKGROUND -->
  <rect width="1200" height="560" rx="24" fill="url(#bg)"/>
  <rect x="24" y="24" width="1152" height="512" rx="18" fill="url(#screenGlow)" stroke="#39425E" stroke-opacity=".55"/>
  <rect x="24" y="24" width="1152" height="512" rx="18" fill="url(#grid)"/>

  <!-- subtle ambient lights -->
  <ellipse cx="230" cy="170" rx="180" ry="110" fill="#7C3AED" opacity=".055" filter="url(#softGlow)"/>
  <ellipse cx="930" cy="410" rx="210" ry="120" fill="#06B6D4" opacity=".045" filter="url(#softGlow)"/>

  <!-- HEADER -->
  <text x="58" y="66" fill="#E8ECF7" class="mono label" font-size="15">KAVYA // SPACE INVADERS</text>
  <text x="1142" y="66" text-anchor="end" fill="#69748F" class="mono tiny">CONTRIBUTIONS ONLINE</text>

  <line x1="58" y1="84" x2="1142" y2="84" stroke="#65708D" stroke-opacity=".3"/>

  <!-- SCORE / STATUS -->
  <text x="62" y="116" fill="#7F8AA5" class="mono tiny">SCORE</text>
  <text x="62" y="139" fill="#F4F7FF" class="mono" font-size="19">0216</text>

  <text x="190" y="116" fill="#7F8AA5" class="mono tiny">LEVEL</text>
  <text x="190" y="139" fill="#F4F7FF" class="mono" font-size="19">BUILD</text>

  <text x="1088" y="116" text-anchor="end" fill="#7F8AA5" class="mono tiny">STATUS</text>
  <text x="1088" y="139" text-anchor="end" fill="#7EE787" class="mono" font-size="14">ONLINE</text>
  <circle cx="1103" cy="134" r="4" fill="#7EE787">
    <animate attributeName="opacity" values=".25;1;.25" dur="1.5s" repeatCount="indefinite"/>
  </circle>

  <!-- ALIEN FORMATION: row 1 -->
  <g filter="url(#glowWarm)" fill="#FF6B6B">
    <g transform="translate(265 185)">
      <path d="M0 12h7V5h7V0h16v5h7v7h7v15h-9v8h-7v-6H16v6H9v-8H0z"/>
      <rect x="10" y="12" width="5" height="5" fill="#0B1020"/>
      <rect x="29" y="12" width="5" height="5" fill="#0B1020"/>
    </g>
    <g transform="translate(390 185)">
      <path d="M0 12h7V5h7V0h16v5h7v7h7v15h-9v8h-7v-6H16v6H9v-8H0z"/>
      <rect x="10" y="12" width="5" height="5" fill="#0B1020"/>
      <rect x="29" y="12" width="5" height="5" fill="#0B1020"/>
    </g>
    <g transform="translate(515 185)">
      <path d="M0 12h7V5h7V0h16v5h7v7h7v15h-9v8h-7v-6H16v6H9v-8H0z"/>
      <rect x="10" y="12" width="5" height="5" fill="#0B1020"/>
      <rect x="29" y="12" width="5" height="5" fill="#0B1020"/>
    </g>
    <g transform="translate(640 185)">
      <path d="M0 12h7V5h7V0h16v5h7v7h7v15h-9v8h-7v-6H16v6H9v-8H0z"/>
      <rect x="10" y="12" width="5" height="5" fill="#0B1020"/>
      <rect x="29" y="12" width="5" height="5" fill="#0B1020"/>
    </g>
    <g transform="translate(765 185)">
      <path d="M0 12h7V5h7V0h16v5h7v7h7v15h-9v8h-7v-6H16v6H9v-8H0z"/>
      <rect x="10" y="12" width="5" height="5" fill="#0B1020"/>
      <rect x="29" y="12" width="5" height="5" fill="#0B1020"/>
    </g>
    <g transform="translate(890 185)">
      <path d="M0 12h7V5h7V0h16v5h7v7h7v15h-9v8h-7v-6H16v6H9v-8H0z"/>
      <rect x="10" y="12" width="5" height="5" fill="#0B1020"/>
      <rect x="29" y="12" width="5" height="5" fill="#0B1020"/>
    </g>
  </g>

  <!-- ALIEN FORMATION: row 2 -->
  <g filter="url(#glowWarm)" fill="#F6C453">
    <g transform="translate(265 250)">
      <path d="M4 5h7V0h8v5h9V0h8v5h7v17h-7v7h-8v-5H19v5h-8v-7H4z"/>
      <rect x="13" y="10" width="5" height="5" fill="#101421"/>
      <rect x="29" y="10" width="5" height="5" fill="#101421"/>
    </g>
    <g transform="translate(390 250)">
      <path d="M4 5h7V0h8v5h9V0h8v5h7v17h-7v7h-8v-5H19v5h-8v-7H4z"/>
      <rect x="13" y="10" width="5" height="5" fill="#101421"/>
      <rect x="29" y="10" width="5" height="5" fill="#101421"/>
    </g>
    <g transform="translate(515 250)">
      <path d="M4 5h7V0h8v5h9V0h8v5h7v17h-7v7h-8v-5H19v5h-8v-7H4z"/>
      <rect x="13" y="10" width="5" height="5" fill="#101421"/>
      <rect x="29" y="10" width="5" height="5" fill="#101421"/>
    </g>
    <g transform="translate(640 250)">
      <path d="M4 5h7V0h8v5h9V0h8v5h7v17h-7v7h-8v-5H19v5h-8v-7H4z"/>
      <rect x="13" y="10" width="5" height="5" fill="#101421"/>
      <rect x="29" y="10" width="5" height="5" fill="#101421"/>
    </g>
    <g transform="translate(765 250)">
      <path d="M4 5h7V0h8v5h9V0h8v5h7v17h-7v7h-8v-5H19v5h-8v-7H4z"/>
      <rect x="13" y="10" width="5" height="5" fill="#101421"/>
      <rect x="29" y="10" width="5" height="5" fill="#101421"/>
    </g>
    <g transform="translate(890 250)">
      <path d="M4 5h7V0h8v5h9V0h8v5h7v17h-7v7h-8v-5H19v5h-8v-7H4z"/>
      <rect x="13" y="10" width="5" height="5" fill="#101421"/>
      <rect x="29" y="10" width="5" height="5" fill="#101421"/>
    </g>
  </g>

  <!-- ALIEN FORMATION: row 3 -->
  <g filter="url(#glowCyan)" fill="#38D6D1">
    <g transform="translate(265 315)">
      <path d="M0 8h8V0h8v5h16V0h8v8h8v20h-8v6h-9v-6H17v6H8v-6H0z"/>
      <rect x="11" y="13" width="5" height="5" fill="#09131D"/>
      <rect x="32" y="13" width="5" height="5" fill="#09131D"/>
    </g>
    <g transform="translate(390 315)">
      <path d="M0 8h8V0h8v5h16V0h8v8h8v20h-8v6h-9v-6H17v6H8v-6H0z"/>
      <rect x="11" y="13" width="5" height="5" fill="#09131D"/>
      <rect x="32" y="13" width="5" height="5" fill="#09131D"/>
    </g>
    <g transform="translate(515 315)">
      <path d="M0 8h8V0h8v5h16V0h8v8h8v20h-8v6h-9v-6H17v6H8v-6H0z"/>
      <rect x="11" y="13" width="5" height="5" fill="#09131D"/>
      <rect x="32" y="13" width="5" height="5" fill="#09131D"/>
    </g>
    <g transform="translate(640 315)">
      <path d="M0 8h8V0h8v5h16V0h8v8h8v20h-8v6h-9v-6H17v6H8v-6H0z"/>
      <rect x="11" y="13" width="5" height="5" fill="#09131D"/>
      <rect x="32" y="13" width="5" height="5" fill="#09131D"/>
    </g>
    <g transform="translate(765 315)">
      <path d="M0 8h8V0h8v5h16V0h8v8h8v20h-8v6h-9v-6H17v6H8v-6H0z"/>
      <rect x="11" y="13" width="5" height="5" fill="#09131D"/>
      <rect x="32" y="13" width="5" height="5" fill="#09131D"/>
    </g>
    <g transform="translate(890 315)">
      <path d="M0 8h8V0h8v5h16V0h8v8h8v20h-8v6h-9v-6H17v6H8v-6H0z"/>
      <rect x="11" y="13" width="5" height="5" fill="#09131D"/>
      <rect x="32" y="13" width="5" height="5" fill="#09131D"/>
    </g>
  </g>

  <!-- MOVING FORMATION -->
  <g>
    <animateTransform attributeName="transform" type="translate"
      values="0 0; 22 0; 0 0; -22 0; 0 0" dur="5s" repeatCount="indefinite"/>
    <rect x="250" y="372" width="670" height="2" fill="#8B5CF6" opacity=".15"/>
  </g>

  <!-- LASER -->
  <g filter="url(#glowCyan)">
    <rect x="596" y="438" width="5" height="48" rx="2.5" fill="#67E8F9">
      <animate attributeName="y" values="438;405;438" dur="1.8s" repeatCount="indefinite"/>
      <animate attributeName="height" values="48;78;48" dur="1.8s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- PLAYER SHIP -->
  <g transform="translate(570 478)" filter="url(#glowCyan)">
    <path d="M30 0 L61 32 H43 L38 43 H22 L17 32 H0 Z" fill="#67E8F9"/>
    <path d="M25 32h21l-5 10H30z" fill="#A5F3FC"/>
    <rect x="28" y="14" width="5" height="9" fill="#0A1422"/>
  </g>

  <!-- SIDE METRICS -->
  <g class="mono">
    <text x="70" y="425" fill="#68738F" font-size="11" letter-spacing="2">CURRENT RUN</text>
    <text x="70" y="450" fill="#E7EBF5" font-size="14">BUILD / BREAK / REPEAT</text>

    <text x="1130" y="425" text-anchor="end" fill="#68738F" font-size="11" letter-spacing="2">HIGH SCORE</text>
    <text x="1130" y="450" text-anchor="end" fill="#F6C453" font-size="14">NO CEILING</text>
  </g>

  <!-- BOTTOM HUD -->
  <line x1="58" y1="500" x2="1142" y2="500" stroke="#65708D" stroke-opacity=".25"/>
  <text x="60" y="522" fill="#56627D" class="mono tiny">INSERT COFFEE</text>
  <text x="1140" y="522" text-anchor="end" fill="#56627D" class="mono tiny">PRESS NOTHING — IT'S AUTOMATIC</text>

  <!-- tiny purple accent -->
  <circle cx="1030" cy="114" r="3" fill="#A78BFA"/>
</svg>
