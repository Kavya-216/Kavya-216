<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-label="Kavya developer console">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#08060d"/><stop offset=".55" stop-color="#130b24"/><stop offset="1" stop-color="#05040a"/></linearGradient>
  <linearGradient id="violet" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#7c3aed"/><stop offset=".5" stop-color="#a78bfa"/><stop offset="1" stop-color="#6d28d9"/></linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="soft"><feGaussianBlur stdDeviation="18"/></filter>
  <style>
    .ui{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;fill:#c4b5fd}
    .dim{fill:#716a80}.line{stroke:#6d28d9;stroke-opacity:.55}.panel{fill:#090711;stroke:#5b21b6;stroke-width:1}.tiny{font-size:13px}.small{font-size:16px}.med{font-size:20px}.head{font-size:25px;font-weight:700;letter-spacing:2px}
  </style>
</defs>
<rect width="1200" height="620" rx="24" fill="url(#bg)"/>
<circle cx="950" cy="80" r="150" fill="#6d28d9" opacity=".12" filter="url(#soft)"/>
<circle cx="210" cy="500" r="130" fill="#a78bfa" opacity=".06" filter="url(#soft)"/>

<rect x="24" y="22" width="1152" height="62" rx="14" class="panel"/>
<circle cx="54" cy="53" r="6" fill="#a78bfa" filter="url(#glow)"/>
<text x="76" y="59" class="ui med">KAVYA-216</text>
<text x="350" y="59" class="ui small dim">/ developer console</text>
<text x="1015" y="59" class="ui small">● ONLINE</text>

<rect x="24" y="104" width="1152" height="238" rx="18" class="panel"/>
<text x="50" y="138" class="ui tiny dim">CURRENT MIND MAP</text>
<text x="50" y="163" class="ui small">idea → code → impact</text>

<g fill="none" class="line">
 <ellipse cx="590" cy="226" rx="235" ry="70"/><ellipse cx="590" cy="226" rx="185" ry="45"/><ellipse cx="590" cy="226" rx="125" ry="28"/>
 <path d="M410 195 Q590 120 770 195"/><path d="M410 257 Q590 330 770 257"/>
</g>
<g class="ui tiny">
 <text x="552" y="230">CORE</text>
 <text x="332" y="186">IDEA</text><text x="790" y="188">CODE</text><text x="786" y="274">IMPACT</text><text x="330" y="275">RESEARCH</text><text x="555" y="315">INSIGHT</text>
</g>
<g fill="#a78bfa" filter="url(#glow)">
 <circle cx="590" cy="226" r="8"/><circle cx="410" cy="195" r="6"/><circle cx="770" cy="195" r="6"/><circle cx="770" cy="257" r="6"/><circle cx="410" cy="257" r="6"/><circle cx="590" cy="296" r="6"/>
</g>
<circle r="4" fill="#fff">
 <animateMotion dur="4s" repeatCount="indefinite" path="M410,195 Q590,120 770,195 Q770,257 590,296 Q410,257 410,195"/>
</circle>

<rect x="930" y="130" width="220" height="180" rx="14" fill="#06050b" stroke="#4c1d95"/>
<text x="950" y="160" class="ui tiny">&gt; system_status</text>
<text x="950" y="190" class="ui tiny">curiosity : <tspan fill="#c4b5fd">high</tspan></text>
<text x="950" y="214" class="ui tiny">focus     : <tspan fill="#c4b5fd">AI / ML</tspan></text>
<text x="950" y="238" class="ui tiny">scope     : <tspan fill="#c4b5fd">unstable</tspan></text>
<text x="950" y="262" class="ui tiny">sleep     : <tspan fill="#c4b5fd">404</tspan></text>
<text x="950" y="286" class="ui tiny">status    : <tspan fill="#c4b5fd">building</tspan></text>

<text x="50" y="383" class="ui head">SELECTED EXPERIMENTS</text>
<line x1="50" y1="398" x2="1150" y2="398" class="line"/>

<g>
 <rect x="50" y="420" width="250" height="150" rx="14" class="panel"/><text x="70" y="447" class="ui tiny dim">EXP_01</text><text x="70" y="480" class="ui med">MITRA</text><text x="70" y="507" class="ui tiny">AI-assisted support</text><text x="70" y="535" class="ui tiny dim">PYTHON · RAG · SUPABASE</text><text x="70" y="558" class="ui tiny">OPEN →</text>
 <rect x="315" y="420" width="250" height="150" rx="14" class="panel"/><text x="335" y="447" class="ui tiny dim">EXP_02</text><text x="335" y="480" class="ui med">UDAAN</text><text x="335" y="507" class="ui tiny">Accessibility technology</text><text x="335" y="535" class="ui tiny dim">PYTHON · MEDIAPIPE · TFLITE</text><text x="335" y="558" class="ui tiny">OPEN →</text>
 <rect x="580" y="420" width="250" height="150" rx="14" class="panel"/><text x="600" y="447" class="ui tiny dim">EXP_03</text><text x="600" y="480" class="ui med">ECOSENTRY</text><text x="600" y="507" class="ui tiny">Environmental audio</text><text x="600" y="535" class="ui tiny dim">PYTHON · SNN · AUDIO</text><text x="600" y="558" class="ui tiny">RESEARCH →</text>
 <rect x="845" y="420" width="305" height="150" rx="14" fill="#090711" stroke="#7c3aed" stroke-dasharray="6 6"/><text x="870" y="450" class="ui tiny dim">EXP_04</text><text x="870" y="485" class="ui med">CLASSIFIED</text><text x="870" y="515" class="ui tiny">still in the works...</text><text x="870" y="545" class="ui tiny dim">you'll know when it's ready</text>
</g>

<text x="50" y="604" class="ui tiny dim">curiosity is currently running in the background_</text>
</svg>
