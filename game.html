<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KAVYA // SPACE INVADERS</title>
  <style>
    :root { color-scheme: dark; --ink: #f5f7ff; --muted: #8b96b2; --line: #29334f; --cyan: #62f3e1; --pink: #ff6b93; --gold: #ffd166; --violet: #9d7bff; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; color: var(--ink); background: #090b16; font: 14px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    body::before { content: ""; position: fixed; inset: 0; pointer-events: none; opacity: .35; background: linear-gradient(115deg, #141632, transparent 42%), repeating-linear-gradient(0deg, transparent 0 3px, rgba(255,255,255,.025) 4px); }
    main { width: min(960px, 100%); position: relative; }
    header { display: flex; justify-content: space-between; align-items: end; gap: 18px; margin-bottom: 14px; }
    h1 { margin: 0; font-size: clamp(17px, 3vw, 25px); letter-spacing: .16em; }
    .tag { color: var(--muted); font-size: 11px; letter-spacing: .12em; text-align: right; }
    .cabinet { border: 1px solid var(--line); padding: 10px; background: rgba(18, 22, 42, .92); box-shadow: 0 20px 70px rgba(0,0,0,.4), 0 0 50px rgba(98,243,225,.06); }
    .hud { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; padding: 4px 6px 12px; }
    .hud div { border-left: 2px solid var(--line); padding-left: 9px; }
    .hud div:first-child { border-color: var(--cyan); }
    .hud div:nth-child(2) { border-color: var(--pink); }
    .hud div:nth-child(3) { border-color: var(--gold); }
    .hud div:last-child { border-color: var(--violet); }
    .label { display: block; color: var(--muted); font-size: 10px; letter-spacing: .14em; margin-bottom: 2px; }
    .value { font-size: clamp(13px, 2vw, 17px); }
    #screen { display: block; width: 100%; aspect-ratio: 16 / 9; border: 1px solid #36415f; background: #0b1020; image-rendering: auto; }
    .controls { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 5px 3px; color: var(--muted); font-size: 11px; }
    button { border: 1px solid var(--line); color: var(--ink); background: #141a30; font: inherit; padding: 10px 13px; cursor: pointer; touch-action: manipulation; }
    button:hover, button:focus-visible { border-color: var(--cyan); color: var(--cyan); outline: none; }
    .mobile-controls { display: none; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-top: 8px; }
    .mobile-controls button { min-height: 44px; font-size: 18px; }
    .mobile-controls button:nth-child(2) { color: var(--pink); }
    @media (max-width: 620px) { body { padding: 12px; } header { align-items: start; flex-direction: column; gap: 4px; } .tag { text-align: left; } .hud { grid-template-columns: repeat(2, 1fr); row-gap: 10px; } .controls { align-items: stretch; flex-direction: column; } .mobile-controls { display: grid; } }
  </style>
</head>
<body>
  <main>
    <header><h1>KAVYA // SPACE INVADERS</h1><div class="tag">THE ARCADE IS ONLINE.<br>THE INVADERS ARE MOVING.</div></header>
    <section class="cabinet" aria-label="Space Invaders game">
      <div class="hud" aria-live="polite">
        <div><span class="label">SCORE</span><span class="value" id="score">00000</span></div>
        <div><span class="label">WAVE</span><span class="value" id="wave">01</span></div>
        <div><span class="label">LIVES</span><span class="value" id="lives">03</span></div>
        <div><span class="label">HIGH SCORE</span><span class="value" id="high">00000</span></div>
      </div>
      <canvas id="screen" tabindex="0" aria-label="Game canvas. Use left and right arrows to move and space to fire."></canvas>
      <div class="controls"><span>ARROWS / A D TO MOVE &nbsp; SPACE TO FIRE</span><button id="start" type="button">START RUN</button></div>
      <div class="mobile-controls" aria-label="Touch controls"><button type="button" data-key="ArrowLeft" aria-label="Move left">&#9664;</button><button type="button" data-key="Space" aria-label="Fire">FIRE</button><button type="button" data-key="ArrowRight" aria-label="Move right">&#9654;</button></div>
    </section>
  </main>
  <script>
    (() => {
      const canvas = document.querySelector('#screen');
      const ctx = canvas.getContext('2d');
      const scoreEl = document.querySelector('#score');
      const waveEl = document.querySelector('#wave');
      const livesEl = document.querySelector('#lives');
      const highEl = document.querySelector('#high');
      const startButton = document.querySelector('#start');
      const keys = new Set();
      const state = { score: 0, high: Number(localStorage.getItem('kavya-invaders-high') || 0), wave: 1, lives: 3, running: false, over: false, last: 0, shotCooldown: 0, enemyCooldown: 0, enemyDirection: 1, enemyStep: 0 };
      const player = { x: 0.5, y: 0.9, width: 0.06, speed: 0.52 };
      let bullets = [], enemyBullets = [], enemies = [], sparks = [];

      function fit() { const ratio = Math.min(window.devicePixelRatio || 1, 2); const rect = canvas.getBoundingClientRect(); canvas.width = rect.width * ratio; canvas.height = rect.height * ratio; ctx.setTransform(ratio, 0, 0, ratio, 0, 0); }
      function size() { return { w: canvas.clientWidth, h: canvas.clientHeight }; }
      function resetWave() { enemies = []; const columns = Math.min(9, 5 + state.wave); for (let row = 0; row < 3; row++) for (let col = 0; col < columns; col++) enemies.push({ x: .2 + col * (.6 / Math.max(columns - 1, 1)), y: .18 + row * .1, row, alive: true }); state.enemyDirection = 1; state.enemyStep = 0; }
      function start() { state.score = 0; state.wave = 1; state.lives = 3; state.running = true; state.over = false; bullets = []; enemyBullets = []; sparks = []; resetWave(); startButton.textContent = 'RESTART RUN'; canvas.focus(); updateHud(); }
      function end(message) { state.running = false; state.over = true; state.high = Math.max(state.high, state.score); localStorage.setItem('kavya-invaders-high', state.high); updateHud(); draw(); drawMessage(message, 'PRESS START RUN TO TRY AGAIN'); }
      function updateHud() { scoreEl.textContent = String(state.score).padStart(5, '0'); waveEl.textContent = String(state.wave).padStart(2, '0'); livesEl.textContent = String(state.lives).padStart(2, '0'); highEl.textContent = String(Math.max(state.high, state.score)).padStart(5, '0'); }
      function fire() { if (!state.running || state.shotCooldown > 0) return; bullets.push({ x: player.x, y: player.y - .04, speed: .8 }); state.shotCooldown = .22; }
      function burst(x, y, color) { for (let i = 0; i < 8; i++) sparks.push({ x, y, dx: (Math.random() - .5) * .4, dy: (Math.random() - .5) * .4, life: .5, color }); }
      function hit(a, b, radius) { return Math.abs(a.x - b.x) < radius && Math.abs(a.y - b.y) < .045; }
      function update(dt) {
        if (!state.running) return;
        const move = keys.has('ArrowLeft') || keys.has('a') ? -1 : keys.has('ArrowRight') || keys.has('d') ? 1 : 0;
        player.x = Math.max(.06, Math.min(.94, player.x + move * player.speed * dt));
        if (keys.has(' ') || keys.has('Space')) fire();
        state.shotCooldown = Math.max(0, state.shotCooldown - dt); state.enemyCooldown -= dt;
        const alive = enemies.filter(enemy => enemy.alive); const edge = alive.some(enemy => enemy.x > .91 || enemy.x < .09);
        if (edge) { state.enemyDirection *= -1; enemies.forEach(enemy => enemy.y += .045); }
        enemies.forEach(enemy => { if (enemy.alive) enemy.x += state.enemyDirection * (.035 + state.wave * .006) * dt; });
        if (state.enemyCooldown <= 0 && alive.length) { const enemy = alive[Math.floor(Math.random() * alive.length)]; enemyBullets.push({ x: enemy.x, y: enemy.y + .03, speed: .2 + state.wave * .015 }); state.enemyCooldown = Math.max(.35, .95 - state.wave * .04); }
        bullets.forEach(bullet => bullet.y -= bullet.speed * dt); enemyBullets.forEach(bullet => bullet.y += bullet.speed * dt);
        bullets = bullets.filter(bullet => bullet.y > 0); enemyBullets = enemyBullets.filter(bullet => bullet.y < 1.1);
        bullets.forEach(bullet => enemies.forEach(enemy => { if (enemy.alive && hit(bullet, enemy, .045)) { enemy.alive = false; bullet.y = -1; state.score += (3 - enemy.row) * 10; burst(enemy.x, enemy.y, enemy.row === 0 ? '#ff6b93' : enemy.row === 1 ? '#ffd166' : '#62f3e1'); } }));
        enemyBullets.forEach(bullet => { if (hit(bullet, player, .05)) { bullet.y = 2; state.lives--; burst(player.x, player.y, '#ff6b93'); if (state.lives <= 0) end('RUN OVER'); } });
        if (enemies.some(enemy => enemy.alive && enemy.y > .82)) end('INVADERS LANDED');
        if (enemies.every(enemy => !enemy.alive)) { state.wave++; resetWave(); }
        sparks.forEach(spark => { spark.x += spark.dx * dt; spark.y += spark.dy * dt; spark.life -= dt; }); sparks = sparks.filter(spark => spark.life > 0); updateHud();
      }
      function drawShip(w, h) { const x = player.x * w, y = player.y * h; ctx.fillStyle = '#62f3e1'; ctx.shadowBlur = 14; ctx.shadowColor = '#62f3e1'; ctx.beginPath(); ctx.moveTo(x, y - h * .04); ctx.lineTo(x + w * .035, y + h * .025); ctx.lineTo(x - w * .035, y + h * .025); ctx.closePath(); ctx.fill(); ctx.shadowBlur = 0; }
      function draw() { const { w, h } = size(); ctx.clearRect(0, 0, w, h); ctx.fillStyle = '#0b1020'; ctx.fillRect(0, 0, w, h); ctx.strokeStyle = 'rgba(132, 148, 190, .08)'; for (let x = 0; x < w; x += 32) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h); ctx.stroke(); } for (let y = 0; y < h; y += 32) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke(); }
        enemies.forEach(enemy => { if (!enemy.alive) return; const colors = ['#ff6b93', '#ffd166', '#62f3e1']; ctx.fillStyle = colors[enemy.row]; ctx.shadowBlur = 12; ctx.shadowColor = colors[enemy.row]; const x = enemy.x * w, y = enemy.y * h, r = Math.max(5, w * .018); ctx.fillRect(x - r, y - r * .55, r * 2, r); ctx.fillRect(x - r * .65, y - r, r * 1.3, r * 2); ctx.shadowBlur = 0; });
        ctx.fillStyle = '#a9f7ff'; bullets.forEach(bullet => ctx.fillRect(bullet.x * w - 1, bullet.y * h, 2, h * .035)); ctx.fillStyle = '#ff6b93'; enemyBullets.forEach(bullet => ctx.fillRect(bullet.x * w - 2, bullet.y * h, 4, h * .025)); sparks.forEach(spark => { ctx.globalAlpha = Math.max(0, spark.life * 2); ctx.fillStyle = spark.color; ctx.fillRect(spark.x * w, spark.y * h, 3, 3); }); ctx.globalAlpha = 1; drawShip(w, h); if (!state.running && !state.over) drawMessage('SPACE INVADERS', 'MOVE. FIRE. SURVIVE.'); }
      function drawMessage(title, subtitle) { const { w, h } = size(); ctx.fillStyle = 'rgba(5, 8, 18, .73)'; ctx.fillRect(0, h * .35, w, h * .3); ctx.textAlign = 'center'; ctx.fillStyle = '#f5f7ff'; ctx.font = `700 ${Math.max(16, w * .035)}px ui-monospace, monospace`; ctx.fillText(title, w / 2, h * .48); ctx.fillStyle = '#62f3e1'; ctx.font = `${Math.max(10, w * .014)}px ui-monospace, monospace`; ctx.fillText(subtitle, w / 2, h * .57); ctx.textAlign = 'start'; }
      function loop(time) { const dt = Math.min(.04, (time - state.last) / 1000 || 0); state.last = time; update(dt); draw(); requestAnimationFrame(loop); }
      window.addEventListener('resize', fit); window.addEventListener('keydown', event => { keys.add(event.key); if (['ArrowLeft', 'ArrowRight', ' ', 'a', 'd'].includes(event.key)) event.preventDefault(); if (event.key === 'Enter' && !state.running) start(); }); window.addEventListener('keyup', event => keys.delete(event.key)); startButton.addEventListener('click', start);
      document.querySelectorAll('[data-key]').forEach(button => { const key = button.dataset.key; button.addEventListener('pointerdown', event => { event.preventDefault(); keys.add(key); if (key === 'Space') fire(); }); ['pointerup', 'pointercancel', 'pointerleave'].forEach(type => button.addEventListener(type, () => keys.delete(key))); });
      fit(); updateHud(); requestAnimationFrame(loop);
    })();
  </script>
</body>
</html>
